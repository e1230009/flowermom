    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full relative z-10 space-y-6">

        <!-- 連結轉換器工具區塊 -->
        <section id="converter" class="bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-2xl space-y-6">
            <div class="border-b border-slate-100 pb-4">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2.5">
                    <i class="fa-solid fa-link text-shopee-500 text-2xl"></i> 社群推廣優惠連結轉換器

                <div class="mt-2 space-y-1">
                    <p class="text-xs sm:text-sm font-semibold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-100 inline-block">

                    </p>
                    <p class="text-xs sm:text-sm text-slate-500 pt-1">貼上蝦皮商品網址，轉換成推廣連結輕鬆領卷</p>
                </div>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="input-url" class="block text-sm font-bold text-slate-800 mb-2">
                        請貼上蝦皮商品網址：
                    </label>
                    <textarea id="input-url" rows="3" placeholder="https://shopee.tw/product/12345/67890" class="w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:outline-none focus:ring-4 focus:ring-shopee-500/15 focus:border-shopee-500 text-base font-mono transition resize-none placeholder:text-slate-300 shadow-inner"></textarea>
                </div>

                <button id="convert-btn" onclick="convertLink()" class="w-full py-4 bg-shopee-500 hover:bg-shopee-600 active:scale-[0.99] text-white font-bold text-base rounded-2xl shadow-lg shadow-shopee-500/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 轉換為推廣優惠連結
                </button>

                <!-- 轉換結果輸出區 -->
                <div id="result-box" class="hidden p-6 bg-slate-900 rounded-2xl text-white space-y-5 shadow-xl transition-all">
                    <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-3">
                        <span class="font-bold"><i class="fa-solid fa-check-circle text-emerald-400 mr-1"></i> 轉換成功</span>
                    </div>

                    <!-- 視覺預覽展示區（顯示封裝文字「直接點擊購買商品」） -->
                    <div class="bg-slate-800/90 p-5 rounded-2xl border border-slate-700/80 space-y-2">
                        <span class="text-[11px] text-slate-400 block font-bold uppercase tracking-wider">推廣連結：</span>
                        <div class="text-lg font-bold text-amber-400 pt-1">
                            👉 <a id="preview-link" href="#" target="_blank" class="hover:underline text-amber-400 font-bold">直接點擊購買商品</a>
                        </div>
                    </div>

                    <!-- 操作按鈕區 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                        
                        <button onclick="copyRawUrl()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-200 text-xs sm:text-sm font-bold rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-copy"></i> 複製連結
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- LINE 社群推廣區塊 -->
        <section class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-3xl p-6 sm:p-8 text-white shadow-2xl relative overflow-hidden border border-emerald-400/30">
            <!-- 裝飾背景圈圈 -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -left-10 -top-10 w-32 h-32 bg-emerald-300/20 rounded-full blur-xl pointer-events-none"></div>

            <div class="relative z-10 flex flex-col sm:flex-row items-center justify-between gap-5 text-center sm:text-left">
                <div class="space-y-2">
                    <div class="inline-flex items-center gap-2 bg-emerald-700/50 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-emerald-100 border border-emerald-400/30">
                        <i class="fa-brands fa-line text-lg text-emerald-300"></i> 花媽獨家優惠群
                    </div>
                    <h3 class="text-xl sm:text-2xl font-black text-white leading-tight">
                        加入花媽 LINE 群獲得更多優惠資訊！
                    </h3>
                    <p class="text-xs sm:text-sm text-emerald-100/90 font-medium">
                        天天分享隱藏版限時折扣與專屬優惠券，幫你精打細算省更多錢 💰
                    </p>
                </div>
                
                <a href="https://reurl.cc/oKNzLV" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto shrink-0 px-6 py-4 bg-white hover:bg-emerald-50 text-emerald-700 font-black text-sm sm:text-base rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-line text-xl text-[#00B900]"></i> 立即加入社群

            </div>
        </section>

    </main>

    <footer class="bg-white/90 backdrop-blur-md border-t border-slate-200/80 py-6 text-center text-xs text-slate-600 relative z-10">
        <p>© 2026 flowermom - 蝦皮分潤推廣網址工具</p>
    </footer>

    <!-- JavaScript 轉碼機制 -->
    <script>
        let currentFullAffiliateUrl = '';
        const DEFAULT_TEXT = '直接點擊購買商品';
        // 您的 蝦皮 Affiliate ID
        const AFFILIATE_ID = '16397180008';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        // 動態生成帶有時間戳與隨機碼的專屬 Sub ID
        function generateRandomSubId() {
            const timestamp = Math.floor(Date.now() / 1000);
            const randomHex = Math.random().toString(36).substring(2, 6);
            return `fm_${timestamp}_${randomHex}`;
        }

        // 自動將短網址 (如 shope.ee / s.shopee.tw) 還原展開為長網址
        async function expandShortUrl(shortUrl) {
            let urlStr = shortUrl.trim();
            if (!urlStr.startsWith('http://') && !urlStr.startsWith('https://')) {
                urlStr = 'https://' + urlStr;
            }

            // 如果是蝦皮常見的短網址格式，透過幾種免費的重導向解析服務進行網址還原
            if (urlStr.includes('shope.ee') || urlStr.includes('s.shopee.tw')) {
                try {
                    // 使用免費的 unshorten API 解析真正的跳轉後網址
                    const apiRes = await fetch(`https://unshorten.me/json/${encodeURIComponent(urlStr)}`);
                    const data = await apiRes.json();
                    if (data && data.success && data.resolved_url) {
                        return data.resolved_url;
                    }
                } catch (e) {
                    console.warn('短網址還原 API 無法回應，將嘗試前端直接解析:', e);
                }
            }
            return urlStr;
        }

        // 清洗網址：若原本就是分潤/轉址連結，自動提取出原始商品網址
        function extractCleanShopeeUrl(rawUrl) {
            let urlStr = rawUrl.trim();

            try {
                // 若網址包含 origin_link 參數（即其他人產生的 an_redir 分潤轉址）
                if (urlStr.includes('origin_link=')) {
                    const parsedUrl = new URL(urlStr);
                    const originLink = parsedUrl.searchParams.get('origin_link');
                    if (originLink) {
                        // 解碼出原本的商品網址
                        urlStr = decodeURIComponent(originLink);
                    }
                }

                // 清除網址尾巴原本附帶的舊分潤與追蹤參數，還原乾淨的商品網址
                const cleanUrl = new URL(urlStr);
                const keysToRemove = [
                    'affiliate_id', 'sub_id', 'sub_id1', 'aff_sub', 'utm_source', 
                    'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 
                    'mmp_pid', 'uls_trackid', '__mobile__'
                ];
                
                keysToRemove.forEach(key => cleanUrl.searchParams.delete(key));
                return cleanUrl.toString();
            } catch (e) {
                // 若解析失敗，則用正則替換移除舊的 affiliate_id 與 sub_id
                return urlStr.replace(/([?&])affiliate_id=[^&]*/gi, '')
                             .replace(/([?&])sub_id=[^&]*/gi, '');
            }
        }

        // 根據官方步驟二至步驟四構建 redirection 網址
        function addAffiliateParams(originalUrl, autoSubId) {
            // 1. 先清洗網址，確保替換掉原本的分潤 ID
            const cleanedUrl = extractCleanShopeeUrl(originalUrl);

            // 2. 步驟 2：對清洗後的原始網址進行 URL 編碼
            const encodedUrl = encodeURIComponent(cleanedUrl);

            // 3. 步驟 3 & 4：組合帶有您專屬 ID 的 redirection 短網址
            const finalRedirUrl = `https://s.shopee.tw/an_redir?origin_link=${encodedUrl}?&affiliate_id=${AFFILIATE_ID}&sub_id=${autoSubId}`;

            return finalRedirUrl;
        }

        // 前端轉換處理 (加入還原短網址步驟)
        async function convertLink() {
            const input = document.getElementById('input-url').value.trim();
            const convertBtn = document.getElementById('convert-btn');

            if (!input) {
                showToast('請先貼上蝦皮網址');
                return;
            }

            // 按鈕載入狀態
            convertBtn.disabled = true;
            convertBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 解析並轉換中...`;

            try {
                // 1. 先嘗試將粉絲貼上的短網址進行還原展開
                const expandedUrl = await expandShortUrl(input);

                // 2. 生成專屬 Sub ID 並封裝為您的分潤連結
                const autoSubId = generateRandomSubId();
                currentFullAffiliateUrl = addAffiliateParams(expandedUrl, autoSubId);

                showToast('轉換成功！');

                // 更新畫面中的預覽連結與文字
                const previewLink = document.getElementById('preview-link');
                previewLink.innerText = DEFAULT_TEXT;
                previewLink.href = currentFullAffiliateUrl;

                document.getElementById('result-box').classList.remove('hidden');
            } catch (err) {
                showToast('轉換失敗，請確認網址格式');
            } finally {
                convertBtn.disabled = false;
                convertBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> 轉換為推廣優惠連結`;
            }
        }

        // 複製純網址（複製連結）
        function copyRawUrl() {
            if (!currentFullAffiliateUrl) {
                showToast('請先轉換網址');
                return;
            }
            const tempInput = document.createElement('textarea');
            tempInput.value = currentFullAffiliateUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast('已複製推廣連結！');
        }
    </script>
</body>
</html>
